name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devops-lab-api:${{ github.sha }} ./app
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api devops-lab-api:${{ github.sha }}
          sleep 5
          curl --fail localhost:8000/health

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tf-lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

